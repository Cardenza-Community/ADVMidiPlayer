; GM MIDI Player — M5Stack Cardputer ADV
; pio run -e cardputer_adv -t upload

[platformio]
default_envs = unified

; ─── Cardputer ADV (con ES8311) ───────────────────────────────────────────────
[env:cardputer_adv]
platform  = espressif32@6.7.0
board     = m5stack-stamps3
framework = arduino

upload_speed    = 921600
monitor_speed   = 115200
monitor_encoding = utf-8
monitor_filters = esp32_exception_decoder

board_build.mcu          = esp32s3
board_build.f_cpu        = 240000000L
board_build.embed_files  = media/ScreenTitle_boot.jpg
board_build.flash_mode   = dio
board_build.flash_size   = 8MB
board_build.partitions   = huge_app.csv
board_upload.flash_size  = 8MB

build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUINO_LOOP_TASK_STACK_SIZE=16384

    -O2

lib_deps =
    m5stack/M5Cardputer @ ^1.0.2
    https://github.com/203Null/M5Unified.git#74fe31c6d9a2bd7c04f81eb4f8f0af99262e3bc2
    m5stack/M5GFX@0.2.31

lib_extra_dirs = lib

; ─── Cardputer v1.1 (senza ES8311, opzione audio da 1 a 3) ───────────────────
[env:cardputer_v11]
extends    = env:cardputer_adv
build_flags =
    ${env:cardputer_adv.build_flags}


; Runtime Cardenza / original Cardputer / ADV; existing CI uses cardenza alias.
[env:unified]
extends = env:cardputer_adv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_flags =
    ${env:cardputer_adv.build_flags}
    -DLAUNCHER_NVS_GUARD
    -Wl,--wrap=esp_partition_erase_range
lib_deps =
    m5stack/M5Cardputer@1.1.1
    https://github.com/203Null/M5Unified.git#74fe31c6d9a2bd7c04f81eb4f8f0af99262e3bc2
    m5stack/M5GFX@0.2.31

[env:cardenza]
extends = env:unified
