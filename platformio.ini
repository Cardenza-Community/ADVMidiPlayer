; GM MIDI Player — M5Stack Cardputer ADV
; pio run -e cardputer_adv -t upload

[platformio]
default_envs = cardputer_adv

; ─── Cardputer ADV (con ES8311) ───────────────────────────────────────────────
[env:cardputer_adv]
platform  = espressif32@6.7.0
board     = m5stack-stamps3
framework = arduino

upload_speed    = 921600
monitor_speed   = 115200
monitor_encoding = utf-8
monitor_filters = esp32_exception_decoder

board_build.mcu          = esp32s3
board_build.f_cpu        = 240000000L
board_build.embed_files  = media/ScreenTitle_boot.jpg
board_build.flash_mode   = dio
board_build.flash_size   = 8MB
board_build.partitions   = huge_app.csv
board_upload.flash_size  = 8MB

build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUINO_LOOP_TASK_STACK_SIZE=16384
    -DBOARD_HAS_PSRAM=0
    -O2

lib_deps =
    m5stack/M5Cardputer @ ^1.0.2

lib_extra_dirs = lib

; ─── Cardputer v1.1 (senza ES8311, opzione audio da 1 a 3) ───────────────────
[env:cardputer_v11]
extends    = env:cardputer_adv
build_flags =
    ${env:cardputer_adv.build_flags}
    -DCARDPUTER_V11

[env:cardenza]
extends = env:cardputer_v11
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_unflags = -DBOARD_HAS_PSRAM=0
build_flags =
    ${env:cardputer_v11.build_flags}
    -DCARDENZA_TARGET
    -Wl,--wrap=esp_partition_erase_range
    -Wl,--wrap=_ZN2m511Power_Class5beginEv
    -Wl,--wrap=_ZN2m59M5Unified10_setup_ledEN4lgfx6boards7board_tE
lib_deps =
    m5stack/M5Cardputer @ 1.1.1
    m5stack/M5Unified @ 0.2.22
    m5stack/M5GFX @ 0.2.31
